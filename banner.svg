<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#1a0f0a"/>
    </linearGradient>
    <pattern id="hex" width="44" height="76" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <polygon points="22,0 44,12.7 44,38 22,50.7 0,38 0,12.7"
               fill="none" stroke="#ff6a00" stroke-opacity="0.12" stroke-width="1"/>
      <polygon points="22,38 44,50.7 44,76 22,88.7 0,76 0,50.7"
               fill="none" stroke="#ff6a00" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>
  <rect width="900" height="220" fill="url(#hex)"/>

  <!-- corner AT-field hexagon emblem -->
  <g transform="translate(80,110)" filter="url(#glow)">
    <polygon points="0,-54 47,-27 47,27 0,54 -47,27 -47,-27"
             fill="none" stroke="#ff6a00" stroke-width="2"/>
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17"
             fill="none" stroke="#8a5cff" stroke-width="1.4"/>
    <line x1="-47" y1="0" x2="47" y2="0" stroke="#39ff88" stroke-width="1" stroke-opacity="0.7"/>
    <line x1="0" y1="-54" x2="0" y2="54" stroke="#39ff88" stroke-width="1" stroke-opacity="0.7"/>
  </g>

  <!-- scan lines -->
  <g stroke="#39ff88" stroke-opacity="0.08">
    <line x1="0" y1="20" x2="900" y2="20"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
  </g>

  <text x="170" y="95" font-family="'Courier New', monospace" font-size="46" fill="#ff6a00" filter="url(#glow)" letter-spacing="4">N.E.R.V.</text>
  <text x="172" y="130" font-family="'Courier New', monospace" font-size="16" fill="#39ff88" letter-spacing="2">STRATEGIC SELF-DEFENSE FORCE — GEOFRONT TERMINAL</text>
  <text x="172" y="160" font-family="'Courier New', monospace" font-size="14" fill="#8a5cff" letter-spacing="1">// AT-FIELD STATUS: DEPLOYED  // SYNC LINK: ESTABLISHED</text>

  <rect x="20" y="20" width="860" height="180" fill="none" stroke="#ff6a00" stroke-opacity="0.4" stroke-width="1.5"/>
  <text x="800" y="35" font-family="'Courier New', monospace" font-size="11" fill="#ff6a00" text-anchor="end" letter-spacing="1">CODE: 0-1-0-0-0-0-0-0</text>
</svg>
